<!DOCTYPE html>
<html>
<body>
<script>
let ws = new WebSocket("ws://localhost:8000/ws");

ws.onopen = () => {
  console.log("connected!");
  ws.send(JSON.stringify({
    obs: [10, 20, -5, 0.8],
    reward: 0,
    done: false
  }));
};

ws.onmessage = msg => {
  console.log("recv:", msg.data);
};
</script>
</body>
</html>
